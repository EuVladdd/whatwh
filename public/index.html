<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211C19">

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<body>
  <div id="app"><p class="loading">Se încarcă site-ul…</p></div>

    <input type="file" name="artwork_1"><input type="file" name="artwork_2">
